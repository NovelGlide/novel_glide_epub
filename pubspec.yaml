name: novel_glide_epub
description: >-
  EPUB parser for Dart, used by the NovelGlide reader. A maintained fork of
  epubx (rbcprolabs/epubx.dart).
repository: https://github.com/NovelGlide/novel_glide_epub
issue_tracker: https://github.com/NovelGlide/novel_glide_epub/issues
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  archive: ^3.1.6
  collection: ^1.15.0
  image: ^4.0.17
  quiver: ^3.0.1+1
  xml: ^6.0.1

dev_dependencies:
  coverage: ^1.11.0
  # Mutation testing. A git dependency on a personal toolchain repo, which is
  # unusual for a public package — it is dev-only, so it never reaches anyone
  # consuming this library, and the alternative is having no mutation gate on
  # a parser that reads untrusted files.
  dart_mutants:
    git:
      url: https://github.com/kai-tw/kai-packages.git
      path: packages/dart_mutants
      ref: dart_mutants-v0.2.9
  lints: ^5.0.0
  test: ^1.25.0
