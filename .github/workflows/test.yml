name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # The same entry point as local development and the release-tag
      # workflow: dart_lints runs `dart analyze --fatal-infos` itself (the
      # flags live in dart_lints.yaml) and then the shared custom rules, so the
      # stock analyzer and those rules cannot disagree about scope. Without
      # --fatal-infos, lint findings are INFO severity and the step would print
      # them and still exit 0.
      - name: Lint
        run: dart run dart_lints

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      # Printed, not gated.
      - name: Report coverage
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=.dart_tool/package_config.json
          awk -F: '/^LF:/ {lines += $2} /^LH:/ {hit += $2} END {
            if (lines == 0) { print "no lines instrumented"; exit }
            printf "line coverage: %d/%d (%.1f%%)\n", hit, lines, hit * 100 / lines
          }' coverage/lcov.info
